<main class="login-page auth-box p-0 overflow-hidden">
  <section class="login-brand-panel text-bg-primary" aria-label="GACI Event Management">
    <!-- <app-app-logo [logoMaxWidth]="220" /> -->
    <!-- <p class="eyebrow text-secondary">GACI EVENT MANAGEMENT</p>
    <h1>Todo lo que necesitás para seguir tu evento.</h1> -->
    <!-- <p class="brand-copy">Accedé al portal de clientes para consultar tus solicitudes y mantenerte en contacto con nuestro equipo.</p> -->
  </section>
  <section class="login-form-panel bg-body" aria-labelledby="login-title">
    <div class="login-card card">
      <div class="card-body">
        <app-app-logo [logoMaxWidth]="220" fixTheme="dark" logoLink="/login" />
        <h2 id="login-title" class="text-body" style="margin-top: 20px;">Bienvenido</h2>
        <form [formGroup]="loginForm" (ngSubmit)="submit()" style="margin-top: 15px;">
          <div class="mb-3">
            <label for="login" class="form-label">Email</label>
            <input id="login" type="email" class="form-control" formControlName="login" autocomplete="username" placeholder="Tu email">
            @if (loginForm.controls.login.touched && loginForm.controls.login.invalid) { <small class="field-error text-danger">Ingresá tu email.</small> }
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" type="password" class="form-control" formControlName="password" autocomplete="current-password" placeholder="Tu contraseña">
            @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) { <small class="field-error text-danger">La contraseña es obligatoria.</small> }
          </div>
          @if (errorMessage) { <div class="alert alert-danger" role="alert">{{ errorMessage }}</div> }
          <button class="btn btn-primary w-100" type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Ingresando...' : 'Ingresar al portal' }}</button>
        </form>
        <a class="help-link link-primary text-decoration-underline link-offset-3" routerLink="/login">¿Necesitás ayuda para ingresar?</a>
      </div>
    </div>
  </section>
</main>
